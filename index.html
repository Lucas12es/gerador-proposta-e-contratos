<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel · LDT Propostas &amp; Contratos</title>
<meta name="description" content="Sistema interno da LDT Negócios &amp; Soluções para criar propostas comerciais e contratos.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#17181B">
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="preload" href="assets/fonts/poppins-400.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="stylesheet" href="assets/css/documents.css">
</head>
<body data-root="">
<noscript><p style="padding:24px">Este sistema precisa de JavaScript para funcionar.</p></noscript>
<div id="content" tabindex="-1">
  <div class="page">
    <section class="hero" aria-labelledby="h-hero">
      <span class="eyebrow">Painel</span>
      <h1 id="h-hero">Propostas e contratos num só lugar</h1>
      <p><span id="hero-name">LDT</span>. Crie documentos com a sua marca, calcule o preço com imposto e taxa da TechFX e gere o PDF em português, inglês ou espanhol.</p>
      <div class="hero-actions">
        <a class="btn btn-primary" href="proposta/index.html"><svg class="i" aria-hidden="true"><use href="#i-plus"/></svg>Nova proposta</a>
        <a class="btn btn-secondary" href="contrato/index.html"><svg class="i" aria-hidden="true"><use href="#i-contract"/></svg>Novo contrato</a>
      </div>
    </section>

    <section class="kpis" id="kpis" aria-label="Resumo"></section>

    <section class="card" aria-labelledby="h-docs">
      <div class="list-head">
        <h2 id="h-docs">Documentos</h2>
        <div role="group" aria-label="Filtrar por tipo" style="display:flex;gap:8px">
          <button class="chip" data-filter="todos" aria-pressed="true">Todos</button>
          <button class="chip" data-filter="proposta" aria-pressed="false">Propostas</button>
          <button class="chip" data-filter="contrato" aria-pressed="false">Contratos</button>
        </div>
        <label class="search"><span class="sr-only">Buscar documentos</span><svg class="i" aria-hidden="true"><use href="#i-search"/></svg><input id="q" type="text" placeholder="Buscar por cliente ou número" autocomplete="off"></label>
      </div>
      <div id="list"></div>
    </section>
  </div>
</div>
<script src="assets/js/core/format.js"></script>
<script src="assets/js/core/store.js"></script>
<script src="assets/js/core/docs-i18n.js"></script>
<script src="assets/js/core/pricing.js"></script>
<script src="assets/js/core/i18n-dict.js"></script>
<script src="assets/js/core/i18n.js"></script>
<script src="assets/js/core/ui.js"></script>
<script src="assets/js/core/bridge.js"></script>
<script src="assets/js/modules/shell.js"></script>
<script src="assets/js/modules/dashboard.js"></script>
</body>
</html>
